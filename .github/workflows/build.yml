name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # Saves the APK and build log to the ci-output branch (handy for fetching from anywhere).
      - name: Save output
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/app-debug.apk out/post-it.apk 2>/dev/null || true
          echo "${{ job.status }} ${GITHUB_SHA}" > out/status.txt
          cd out
          git init -q -b ci-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-output

      # Publishes the APK as the "latest" release so you can download it on your phone.
      - name: Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag -R "${{ github.repository }}" || true
          gh release create latest out/post-it.apk -R "${{ github.repository }}" \
            --target "${GITHUB_SHA}" -t "Post-it (latest build)" -n "Built from ${GITHUB_SHA::7}"
